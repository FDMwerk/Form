name: FormMobile
options:
  bundleIdPrefix: de.fdmwerk
  deploymentTarget:
    iOS: '17.0'
targets:
  FormMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Resources/Web
        type: folder
        buildPhase: resources
      - path: Resources
        buildPhase: resources
        excludes: [Info.plist, Examples]
      - path: Resources/Examples
        type: folder
        buildPhase: resources
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: viewport.js
        buildPhase: resources
      - path: sidebar.js
        buildPhase: resources
      - path: native-chrome.js
        buildPhase: resources
      - path: viewport.css
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fdmwerk.form.mobile
        PRODUCT_NAME: FormMobile
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D5VE86DJ5H
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FormMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FormMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  FormMobile:
    build:
      targets:
        FormMobile: all
    test:
      targets: [FormMobileTests]
