name: Form
options:
  bundleIdPrefix: de.fdmwerk
  deploymentTarget:
    macOS: '14.0'
configs:
  Debug: debug
  Release: release
  AppStore: release
targets:
  Form:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Web
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Form.entitlements
        ENABLE_APP_SANDBOX: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.fdmwerk.form
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        FORM_DISTRIBUTION_FLAVOR: Desktop
      configs:
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FORM_APP_STORE"
          FORM_DISTRIBUTION_FLAVOR: AppStore
